# xcodegen spec — run ./make.sh to turn this into Office.xcodeproj
name: Office
options:
  bundleIdPrefix: com.pyinv
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Office:
    type: application
    platform: iOS
    sources: [Office]
    dependencies:
      - target: OfficeShare          # the Share Sheet entry, embedded in the app
    entitlements:
      path: Office/Office.entitlements
      properties:
        com.apple.security.application-groups: [group.com.pyinv.office]   # the Office address, shared with OfficeShare
    info:
      path: Office/Info.plist
      properties:
        CFBundleDisplayName: Office
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIViewControllerBasedStatusBarAppearance: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.pyinv.office
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic

  # Share → Office: texts, links, photos and files from any app go to one agent as one message
  OfficeShare:
    type: app-extension
    platform: iOS
    sources:
      - OfficeShare
      - Office/OfficeAddress.swift
    info:
      path: OfficeShare/Info.plist
      properties:
        CFBundleDisplayName: Office
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 50
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 50
    entitlements:
      path: OfficeShare/OfficeShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.pyinv.office]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.pyinv.office.share
